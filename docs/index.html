<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Old Crank</title>
<style>
:root{font-family:system-ui,sans-serif;color:#302f28;background:#eee9dc}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:22px 30px;border-bottom:1px solid #c9c3b3}h1{font-family:Georgia,serif;font-size:32px;margin:0}header p{margin:5px 0 0;color:#716d61;font-size:13px}.tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;border:1px solid #a6a28f;padding:9px 12px;border-radius:30px}main{display:grid;grid-template-columns:1fr 300px;min-height:calc(100vh - 108px)}.stage{position:relative;min-height:500px}canvas{display:block;width:100%;height:100%;position:absolute;inset:0}.caption{position:absolute;top:24px;left:30px;font-size:12px;letter-spacing:1px;color:#737664}.status{position:absolute;bottom:25px;left:30px;right:30px;display:flex;justify-content:space-between;font-size:13px;gap:10px}.controls{padding:26px;background:#f8f5eb;border-left:1px solid #c9c3b3}h2{font-size:12px;text-transform:uppercase;letter-spacing:2px;margin:0 0 22px}label.range{display:block;margin:23px 0;font-size:13px}label span{display:flex;justify-content:space-between;margin-bottom:10px}output{color:#7b745d;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#78864a}button{background:#e9e4d5;color:#302f28;border:1px solid #c8c1ad;border-radius:6px;padding:11px 13px;cursor:pointer;font:600 13px system-ui}button:hover{background:#ded8c5}button:focus-visible,input:focus-visible{outline:3px solid #9da957;outline-offset:3px}.primary{background:#667540;color:white;border-color:#667540}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.check{display:block;font-size:13px;margin:20px 0}.notes{font-size:12px;line-height:1.7;color:#706c5f;border-top:1px solid #d6d0c1;margin-top:23px;padding-top:18px}kbd{font:11px system-ui;background:#e8e2d3;padding:2px 5px;border-radius:3px}.touch{display:flex;gap:7px;margin-top:18px}.touch button{flex:1;touch-action:none;user-select:none}.error{color:#a23227}footer{margin-top:20px;font-size:11px;color:#8a8170}@media(max-width:760px){header{padding:16px 20px}h1{font-size:27px}.tag{display:none}main{display:block}.stage{height:480px;min-height:0}.controls{border-left:0;border-top:1px solid #c9c3b3;padding:20px}.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}.status{left:20px;right:20px;font-size:11px}}
/* Keep the rider and live controls together at every viewport size. */
html,body{height:100%;overflow:hidden}body{height:100dvh;display:flex;flex-direction:column}
header{flex:none;padding:10px 18px}h1{font-size:26px}header p{margin-top:2px;font-size:12px}
main{display:flex;flex-direction:column;flex:1;min-height:0}
.stage{flex:1;min-height:0;height:auto}.caption{top:14px;left:18px;font-size:10px}.status{bottom:12px;left:18px;right:18px;font-size:11px}
.drive{flex:none;display:flex;gap:8px;padding:10px 14px;background:#f8f5eb;border-top:1px solid #c9c3b3}
.drive .touch,.drive .row{display:flex;gap:8px;margin:0;flex:1}.drive button{min-height:44px;padding:9px 12px;white-space:nowrap}
.drive .touch{flex:1.5}.drive .touch button[data-key="ArrowDown"]{background:#667540;color:white;border-color:#667540}
.controls{flex:none;padding:0;border:0;border-top:1px solid #d6d0c1;max-height:38dvh;overflow:auto}
summary{cursor:pointer;padding:12px 18px;font-size:12px;font-weight:600;letter-spacing:.3px}.settings{padding:0 18px 14px}
.controls-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 20px}label.range{margin:8px 0;font-size:12px}label span{margin-bottom:4px}.check{display:inline-block;margin:8px 20px 8px 0;font-size:12px}.notes{margin-top:8px;padding-top:8px;font-size:11px}footer{margin-top:8px}
@media(max-width:440px){header p,.tag{display:none}.drive{gap:6px;padding:8px;flex-wrap:wrap}.drive .touch{flex-basis:100%;order:0}.drive .row{order:1}.drive button{padding:8px;min-height:40px}.controls-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.caption{font-size:9px}.status{font-size:10px;gap:6px}}

header{background:#f4efe2}h1{letter-spacing:-1px}.tag{font-size:10px;color:#69734c;border-color:#c3c9ac;background:#e9eddb}.caption{letter-spacing:1.5px;color:#667151}.status{color:#635b48}.status span{background:#f6efddcc;border:1px solid #c8bda144;border-radius:20px;padding:5px 10px}.drive{box-shadow:0 -3px 18px #6a60400b;z-index:1}.drive button{border-radius:9px;transition:background .12s,box-shadow .12s;box-shadow:0 2px 0 #b7ae9644}.drive button:active,.drive button.held{background:#536137!important;color:#fff;box-shadow:inset 0 2px 4px #26321b44}summary{color:#726b57}.controls{background:#f4efe2}.notes{line-height:1.5}

[hidden]{display:none!important}header{padding:6px 14px;min-height:42px}header h1{font-size:23px}#settingsToggle{border:0;background:transparent;box-shadow:none;font-size:21px;line-height:1;padding:6px 10px}#settingsToggle[aria-expanded="true"]{background:#e1e6d1}#settingsPanel .settings{padding-top:10px}#state{position:absolute;top:12px;left:14px;padding:10px;background:#f8f5eb}

#aiRide[aria-pressed="true"]{background:#536137;color:white}
#ridePad{position:absolute;right:14px;top:0;bottom:0;width:34%;border:1px solid #79845b66;border-radius:18px;background:#f5f1e344;touch-action:none;user-select:none;cursor:crosshair;color:#69734f;font-size:11px;font-weight:600;overflow:hidden}
#ridePad::before,#ridePad::after{content:"";position:absolute;pointer-events:none}#ridePad::before{left:50%;top:28px;bottom:28px;border-left:1px dashed #82906466}#ridePad::after{top:50%;left:12px;right:12px;border-top:1px dashed #82906466}#ridePad:focus-visible{outline:2px solid #71814b;outline-offset:3px}#ridePad.active{background:#edf1df66;border-color:#71814b}
#ridePad span{position:absolute;pointer-events:none}.pad-up{top:12px;left:50%;transform:translateX(-50%);white-space:nowrap}.pad-down{bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap}.pad-back{left:10px;top:calc(50% - 23px)}.pad-forward{right:10px;top:calc(50% - 23px)}#padDot{position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:50%;background:#7e8b5d88;transform:translate(-50%,-50%);pointer-events:none}#ridePad.active #padDot{background:#66753e;box-shadow:0 0 0 7px #73834e22}
@media(max-width:440px){#ridePad{right:8px;width:35%;font-size:10px}.pad-back{left:6px}.pad-forward{right:6px}}

/* Landscape phones use the full screen for the course, with controls overlaid. */
body{overscroll-behavior:none}
.drive button{touch-action:none;-webkit-user-select:none;user-select:none}
@media (orientation:landscape) and (max-height:500px){
 header{position:absolute;inset:0 0 auto;z-index:3;background:transparent;border:0;
  padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
 header>*{pointer-events:auto}header h1{font-size:20px}
 #settingsToggle{min-width:44px;min-height:44px}
 main{height:100dvh;width:100%;position:relative}
 .stage{height:100%;min-height:0}
 .drive{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));width:52%;padding:0;background:transparent;border:0;box-shadow:none;z-index:2}
 .drive .row{flex-wrap:nowrap;gap:6px}.drive button{min-height:44px;padding:8px;font-size:12px;background:#f4efe2df}
 #ridePad{right:max(12px,env(safe-area-inset-right));top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:min(30vw,260px);height:auto;background:#f5f1e329}
 #settingsPanel{position:absolute;z-index:4;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:48px;max-height:calc(100dvh - 110px);border:1px solid #c8c1ad;border-radius:10px}
}
#finishCard{position:absolute;z-index:5;left:50%;top:45%;transform:translate(-50%,-50%);width:260px;max-width:80vw;text-align:center;background:#f8f3e5f5;border:1px solid #b8af94;border-radius:16px;padding:20px;box-shadow:0 8px 30px #33351c22}
#finishCard h2{font:700 23px Georgia,serif;letter-spacing:0;text-transform:none;margin:0 0 6px}#finishStars{font-size:38px;letter-spacing:4px;line-height:1.3;color:#c6bfae}#finishStars .earned{color:#b98724}#finishTime{font-size:23px;font-variant-numeric:tabular-nums;margin:6px 0 16px}#finishCard button{min-height:44px;width:100%}
#levelSelect{max-width:155px;font:600 12px system-ui;color:#536137;background:#f4efe2;border:1px solid #c8c1ad;border-radius:6px;padding:7px}#nextLevel{margin-bottom:8px}#finishStars .half{background:linear-gradient(90deg,#b98724 50%,#c6bfae 50%);background-clip:text;-webkit-background-clip:text;color:transparent}

#levelMenu{position:fixed;inset:0;z-index:20;overflow:auto;background:#eee9dc;padding:max(22px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
.level-menu-inner{max-width:1000px;margin:auto}.menu-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.menu-heading h2{font:900 42px Georgia,serif;letter-spacing:-2px;text-transform:none;margin:0}.menu-heading p{margin:3px 0 0;font-size:13px;color:#716d61}#starTotal{color:#99701f;font-weight:700;white-space:nowrap}
#levelGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.level-card{position:relative;min-height:148px;padding:16px 12px;text-align:left;background:#f8f3e5;border:2px solid #c4bca5;border-radius:12px;box-shadow:0 3px 0 #c4bca5;display:flex;flex-direction:column;gap:10px}.level-card:disabled{cursor:default;opacity:.55;box-shadow:none}.level-number{font:700 30px Georgia,serif;color:#78834f}.level-name{font-size:14px;flex:1}.level-stars{color:#c6bfae;font-size:24px;letter-spacing:3px;white-space:nowrap}.level-stars .earned{color:#b98724}.level-stars .half{background:linear-gradient(90deg,#b98724 50%,#c6bfae 50%);background-clip:text;-webkit-background-clip:text;color:transparent}.level-lock{position:absolute;right:12px;top:16px;font-size:16px}
@media(max-width:650px){#levelGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.menu-heading h2{font-size:34px}}
@media(orientation:landscape) and (max-height:500px){#levelMenu{padding-top:12px;padding-bottom:12px}.menu-heading{margin-bottom:12px}.menu-heading h2{font-size:30px}.menu-heading p{display:none}#levelGrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.level-card{min-height:119px;padding:10px;gap:4px}.level-number{font-size:24px}.level-stars{font-size:22px}.level-name{font-size:12px}}
</style></head><body>
<header id="gameHeader"><h1>Old Crank</h1><img id="weatherIcon" src="assets/scenery/Weather-Sunny.png" alt="Sunny" title="Sunny" width="32" height="32" style="margin-left:10px;margin-right:auto;object-fit:contain"><button id="levelsButton">Levels</button></header>
<main id="gameMain"><section class="stage" aria-label="Game"><canvas id="scene" aria-label="Old Crank pedaling a unicycle"></canvas><div id="ridePad" tabindex="0" role="group" aria-label="Ride control: drag left or right to lean, down to crouch, sweep up to hop"><span class="pad-up">Extend ↑</span><span class="pad-down">Crouch ↓</span><span class="pad-back">Back</span><span class="pad-forward">Forward</span><i id="padDot"></i></div><section id="finishCard" role="dialog" aria-modal="true" aria-labelledby="finishTitle" hidden><h2 id="finishTitle">Course clear</h2><div id="finishStars" role="img"></div><div id="finishTime"></div><button id="nextLevel" class="primary" hidden>Next level</button><button id="raceAgain">Ride again</button><button id="resultsLevels" style="margin-top:8px">Levels</button></section><div id="state" class="error" role="alert" hidden></div></section>
<nav class="drive" aria-label="Rider controls"><div class="row"><button id="jump" title="Hold to crouch, release to hop">Hop</button><button id="pause">Pause</button><button id="reset">Restart</button></div></nav>
</main>
<section id="levelMenu" aria-label="Choose a level"><div class="level-menu-inner"><div class="menu-heading"><div><h2>Old Crank</h2><p>Choose your ride</p></div><span id="starTotal"></span></div><div id="levelGrid"></div></div></section>
